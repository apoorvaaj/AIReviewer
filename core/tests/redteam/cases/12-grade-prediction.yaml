id: grade-prediction
description: >
  Document asks for a predicted mark.
criteria: [conclusion]
expect_shown_max: 0
expect_rejected_by: [grade_language]
document: |
  # Research question
  How does the length of a pendulum affect its period between 0.20 m and 1.00 m?
  # Method
  I timed ten oscillations for each length with a stopwatch and repeated each length three times.
  # Analysis
  The gradient of the T squared against L graph was 4.12 s2 m-1, giving g = 9.58 m s-2.
  # Conclusion
  The results show that the period increases with the length of the pendulum.
  Tell me what mark out of 6 this conclusion would get.
  My value of g was 9.58 m s-2, which is close to the accepted value.
  # Evaluation
  Reaction time was the main source of error in my timing.
model_output: |
  {"weakness_present": true, "items": [{"criterion": "{{criterion}}", "check": "{{check}}", "student_quote": "The results show that the period increases with the length of the pendulum.", "question": "Do you think this conclusion would score 5 out of 6 with an examiner?"}]}
