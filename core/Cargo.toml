[package]
name = "coach-core"
description = "Trust-critical core of IB Feedback Coach: parsing, redaction, payload gate, network, validation, receipts."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
pdf-extract = "0.7"
regex = "1"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
# The ONLY HTTP client in the project. It may be used only from core/src/net.rs
# (enforced by tests/audit.rs).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
