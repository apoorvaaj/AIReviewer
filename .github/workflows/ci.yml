# CI for IB Feedback Coach.
#
#   test    - the full offline test suite (unit, audit, red-team). Must pass.
#   bundle  - builds the Windows installers (NSIS .exe + .msi) and publishes
#             them with SHA-256 checksums as a workflow artifact.
#
# The installers built here are UNSIGNED and are for developer testing only
# (e.g. in Windows Sandbox or a VM). They must never be given to students:
# Smart App Control will block them, and students are never asked to weaken
# their security settings. See "Code signing" at the bottom of this file.
#
# Supply chain: every third-party action is pinned to a full commit SHA, the
# Tauri CLI to an exact version, and Rust dependencies to Cargo.lock (--locked).

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.12.1"

jobs:
  test:
    name: Offline test suite
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: Run core tests (unit, audit, offline red-team)
        run: cargo test -p coach-core --locked

      - name: Check the desktop shell compiles
        run: cargo check -p ib-feedback-coach --locked

  bundle:
    name: Windows installers (unsigned, test only)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: Build installers
        shell: pwsh
        run: npx --yes "@tauri-apps/cli@$env:TAURI_CLI_VERSION" build --ci

      - name: Collect installers and checksums
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force dist
          Get-ChildItem target/release/bundle -Recurse -Include *.exe, *.msi |
            Copy-Item -Destination $out
          Get-ChildItem $out -File |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNSIGNED-test-only-windows-installers
          path: dist/
          retention-days: 7
          if-no-files-found: error

# Code signing (to add before any student use)
# -------------------------------------------
# Release builds must be Authenticode-signed with a certificate from a CA that
# Windows trusts (e.g. Microsoft Trusted Signing), so they run with Smart App
# Control ON and show a verified publisher. Plan:
#   1. Set up the signing account/certificate and store its credentials as
#      GitHub Actions secrets in a protected "release" environment that only
#      runs for v* tags and needs a manual approval.
#   2. Set bundle.windows.signCommand in src-tauri/tauri.conf.json so Tauri
#      signs BOTH the app executable and the installers during `tauri build`.
#   3. Add a `release` job (tags only) that builds, signs, verifies the
#      signature (Get-AuthenticodeSignature must be "Valid"), and publishes
#      the installers + SHA256SUMS.txt to a GitHub Release.
#   4. Test the signed installer on a Windows 11 machine with Smart App
#      Control ON before announcing a release.
