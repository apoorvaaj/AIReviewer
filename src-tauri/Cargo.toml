[package]
name = "ib-feedback-coach"
description = "IB Feedback Coach desktop app (Tauri shell around coach-core)"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
coach-core = { path = "../core" }
# No tauri features beyond the default; no http, shell, fs, updater or
# notification plugins. Only the dialog plugin (native open/save dialogs).
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
